name: 'Teams Notification'
description: 'Send formatted Teams notifications'
inputs:
  webhook_url:
    description: 'Teams webhook URL'
    required: true
  status:
    description: 'Status (success/failure/warning)'
    required: true
  environment:
    description: 'Environment name'
    required: true
  message:
    description: 'Custom message'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Send Teams notification
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook_url }}
        STATUS: ${{ inputs.status }}
        ENVIRONMENT: ${{ inputs.environment }}
        MESSAGE: ${{ inputs.message }}
        REPOSITORY: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        case "$STATUS" in
          success) COLOR="28a745"; ICON="✅" ;;
          failure) COLOR="dc3545"; ICON="❌" ;;
          warning) COLOR="ffc107"; ICON="⚠️" ;;
          *)       COLOR="cccccc"; ICON="•"  ;;
        esac

        PAYLOAD=$(jq -n \
          --arg color   "$COLOR" \
          --arg icon    "$ICON" \
          --arg status  "$STATUS" \
          --arg env     "$ENVIRONMENT" \
          --arg repo    "$REPOSITORY" \
          --arg ref     "$REF_NAME" \
          --arg sha     "$SHA" \
          --arg actor   "$ACTOR" \
          --arg msg     "$MESSAGE" \
          --arg run_uri "$RUN_URL" \
          '{
             "@type":    "MessageCard",
             "@context": "http://schema.org/extensions",
             themeColor: $color,
             summary:    ("Terraform Pipeline - " + $env),
             sections: [{
               activityTitle:    ($icon + " Terraform Pipeline - " + $env),
               activitySubtitle: ("Status: " + $status),
               facts: [
                 {name: "Repository:", value: $repo},
                 {name: "Branch:",     value: $ref},
                 {name: "Commit:",     value: $sha},
                 {name: "Actor:",      value: $actor}
               ],
               text: $msg
             }],
             potentialAction: [{
               "@type":  "OpenUri",
               name:     "View Run",
               targets: [{os: "default", uri: $run_uri}]
             }]
           }')

        HTTP_CODE=$(curl -sS -o /tmp/teams-response.txt -w "%{http_code}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "$WEBHOOK_URL")

        if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
          echo "::error::Teams webhook returned HTTP $HTTP_CODE"
          cat /tmp/teams-response.txt || true
          exit 1
        fi
