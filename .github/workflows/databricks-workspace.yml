name: Databricks Workspace

on:
  pull_request:
    paths:
      - "config/teams/**"
      - "terraform/modules/databricks-workspace/**"
      - "terraform/databricks/**"
  workflow_dispatch:
    inputs:
      team:
        description: "Team name (folder name under config/teams/) or 'all' to run all teams"
        required: true
        default: "all"
      environment:
        description: "Environment (dev|qa|staging|prod|all)"
        required: true
        default: "all"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Load shared config (runners, etc.) — runs first so other jobs can use outputs
  # ─────────────────────────────────────────────────────────────────────────────
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
      terraform_version: ${{ steps.load.outputs.terraform_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Load base config
        id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          TF_VERSION=$(jq -r '.terraform.version' config/global/base.json)
          echo "runners=$RUNNERS" >> "$GITHUB_OUTPUT"
          echo "terraform_version=$TF_VERSION" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Detect which teams and environments need to be processed
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Teams
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    needs: _config
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      matrix-lower: ${{ steps.build-matrix.outputs.matrix-lower }}
      matrix-upper: ${{ steps.build-matrix.outputs.matrix-upper }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
      has-lower: ${{ steps.build-matrix.outputs.has-lower }}
      has-upper: ${{ steps.build-matrix.outputs.has-upper }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build team/env matrix
        id: build-matrix
        env:
          TEAM_INPUT: ${{ github.event.inputs.team || '' }}
          ENV_INPUT: ${{ github.event.inputs.environment || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          pairs=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$TEAM_INPUT" == "all" ]]; then
              teams=$(ls config/teams/ | grep -v '^_')
            else
              teams="$TEAM_INPUT"
            fi

            for team in $teams; do
              env_dir="config/teams/${team}/envs"
              if [[ ! -d "$env_dir" ]]; then
                echo "::warning::No envs/ directory found for team '$team', skipping"
                continue
              fi

              all_envs=$(ls "$env_dir" 2>/dev/null | grep '\.tfvars$' | sed 's/\.tfvars$//' | sort)
              if [[ -z "$all_envs" ]]; then
                echo "::warning::No envs/*.tfvars files found for team '$team', skipping"
                continue
              fi

              if [[ "$ENV_INPUT" == "all" ]]; then
                envs="$all_envs"
              else
                envs="$ENV_INPUT"
              fi

              for env in $envs; do
                if echo "$all_envs" | grep -qx "$env"; then
                  sub_alias=$(jq -r ".env_to_subscription[\"$env\"] // empty" config/global/subscriptions.json)
                  if [[ -z "$sub_alias" ]]; then
                    echo "::warning::No subscription alias for env '$env', skipping ${team}/${env}"
                    continue
                  fi
                  pairs+=("{\"team\":\"${team}\",\"environment\":\"${env}\",\"subscription_alias\":\"${sub_alias}\"}")
                else
                  echo "::warning::Team '$team' does not have environment '$env', skipping"
                fi
              done
            done

          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
            else
              base_sha="HEAD~1"
            fi

            changed_files=$(git diff --name-only "$base_sha" HEAD)
            echo "Changed files:"
            echo "$changed_files"

            module_changed=$(echo "$changed_files" | grep -E "^terraform/(modules/databricks-workspace|databricks)/" | head -1 || true)

            if [[ -n "$module_changed" ]]; then
              echo "Module files changed — queuing all teams"
              changed_teams=$(ls config/teams/ | grep -v '^_')
            else
              changed_teams=$(echo "$changed_files" | grep "^config/teams/" | sed 's|config/teams/||;s|/.*||' | grep -v '^_' | sort -u || true)
            fi

            for team in $changed_teams; do
              env_dir="config/teams/${team}/envs"
              if [[ ! -d "$env_dir" ]]; then
                continue
              fi

              envs=$(ls "$env_dir" 2>/dev/null | grep '\.tfvars$' | sed 's/\.tfvars$//' | sort)
              if [[ -z "$envs" ]]; then
                continue
              fi

              for env in $envs; do
                sub_alias=$(jq -r ".env_to_subscription[\"$env\"] // empty" config/global/subscriptions.json)
                if [[ -z "$sub_alias" ]]; then
                  echo "::warning::No subscription alias for env '$env', skipping ${team}/${env}"
                  continue
                fi
                pairs+=("{\"team\":\"${team}\",\"environment\":\"${env}\",\"subscription_alias\":\"${sub_alias}\"}")
              done
            done
          fi

          lower_pairs=()
          upper_pairs=()
          for pair in "${pairs[@]}"; do
            if [[ "$pair" == *'"environment":"dev"'* || "$pair" == *'"environment":"qa"'* ]]; then
              lower_pairs+=("$pair")
            elif [[ "$pair" == *'"environment":"staging"'* || "$pair" == *'"environment":"prod"'* ]]; then
              upper_pairs+=("$pair")
            fi
          done

          if [[ ${#pairs[@]} -eq 0 ]]; then
            echo "No teams to process"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "matrix-lower={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "matrix-upper={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "has-lower=false" >> "$GITHUB_OUTPUT"
            echo "has-upper=false" >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${pairs[*]}")
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Matrix: {\"include\":[${joined}]}"

            if [[ ${#lower_pairs[@]} -gt 0 ]]; then
              joined_lower=$(IFS=,; echo "${lower_pairs[*]}")
              echo "matrix-lower={\"include\":[${joined_lower}]}" >> "$GITHUB_OUTPUT"
              echo "has-lower=true" >> "$GITHUB_OUTPUT"
            else
              echo "matrix-lower={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "has-lower=false" >> "$GITHUB_OUTPUT"
            fi

            if [[ ${#upper_pairs[@]} -gt 0 ]]; then
              joined_upper=$(IFS=,; echo "${upper_pairs[*]}")
              echo "matrix-upper={\"include\":[${joined_upper}]}" >> "$GITHUB_OUTPUT"
              echo "has-upper=true" >> "$GITHUB_OUTPUT"
            else
              echo "matrix-upper={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "has-upper=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Plan — runs for every team+env in the matrix
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Plan · ${{ matrix.team }} / ${{ matrix.environment }}"
    needs: [_config, detect-changes]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    # All subscription secrets exposed as env vars so the resolve step can select
    # the right one via shell logic (GitHub Actions does not support dynamic secret
    # access via secrets[variable] notation).
    env:
      AZURE_SUB_DEV_QA: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
      AZURE_CLIENT_DEV_QA: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
      AZURE_SUB_STAGING_PROD: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
      AZURE_CLIENT_STAGING_PROD: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
      TF_SA_DEV_QA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
      TF_SA_STAGING_PROD: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
      TF_RG_DEV_QA: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
      TF_RG_STAGING_PROD: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate team config files
        env:
          TEAM: ${{ matrix.team }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          TEAM_DIR="config/teams/${TEAM}"
          COMMON="${TEAM_DIR}/common.tfvars"
          ENV_FILE="${TEAM_DIR}/envs/${ENVIRONMENT}.tfvars"

          missing=()
          [[ -f "$COMMON"   ]] || missing+=("$COMMON")
          [[ -f "$ENV_FILE" ]] || missing+=("$ENV_FILE")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required config files for ${TEAM}/${ENVIRONMENT}:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve subscription credentials
        id: sub
        run: |
          ALIAS="${{ matrix.subscription_alias }}"
          if [[ "$ALIAS" == "dev-qa" ]]; then
            echo "sub_id=$AZURE_SUB_DEV_QA"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_DEV_QA" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_DEV_QA"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_DEV_QA"             >> "$GITHUB_OUTPUT"
          else
            echo "sub_id=$AZURE_SUB_STAGING_PROD"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_STAGING_PROD" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_STAGING_PROD"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_STAGING_PROD"             >> "$GITHUB_OUTPUT"
          fi
          CONTAINER=$(jq -r ".subscriptions[\"$ALIAS\"].state_container" config/global/subscriptions.json)
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: ${{ needs._config.outputs.terraform_version }}
          working_directory: terraform/databricks
          environment: ${{ matrix.environment }}

      - name: Terraform init
        working-directory: terraform/databricks
        env:
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          RESOURCE_GROUP: ${{ steps.sub.outputs.rg }}
          CONTAINER: ${{ steps.sub.outputs.container }}
          STATE_KEY: "workspace/${{ matrix.team }}/${{ matrix.environment }}.tfstate"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=$STATE_KEY"

      - name: Terraform validate
        working-directory: terraform/databricks
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          # -detailed-exitcode exits 0=no changes, 1=error, 2=changes present.
          # Disable pipefail around this command so exit code 2 is handled explicitly.
          set +e
          terraform plan \
            -var-file=../../config/teams/${{ matrix.team }}/common.tfvars \
            -var-file=../../config/teams/${{ matrix.team }}/envs/${{ matrix.environment }}.tfvars \
            -out=tfplan \
            -detailed-exitcode \
            -input=false 2>&1 | tee plan.log
          TF_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ $TF_EXIT -eq 1 ]]; then
            echo "Terraform plan failed"
            exit 1
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.team }}-${{ matrix.environment }}
          path: |
            terraform/databricks/tfplan
            terraform/databricks/plan.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Apply — dev and qa: auto-apply after successful plan
  # ─────────────────────────────────────────────────────────────────────────────
  apply-lower:
    name: "Apply · ${{ matrix.team }} / ${{ matrix.environment }}"
    needs: [_config, detect-changes, plan]
    if: |
      needs.detect-changes.outputs.has-lower == 'true' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      github.event_name != 'pull_request'
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix-lower) }}
    env:
      AZURE_SUB_DEV_QA: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
      AZURE_CLIENT_DEV_QA: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
      AZURE_SUB_STAGING_PROD: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
      AZURE_CLIENT_STAGING_PROD: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
      TF_SA_DEV_QA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
      TF_SA_STAGING_PROD: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
      TF_RG_DEV_QA: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
      TF_RG_STAGING_PROD: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve subscription credentials
        id: sub
        run: |
          ALIAS="${{ matrix.subscription_alias }}"
          if [[ "$ALIAS" == "dev-qa" ]]; then
            echo "sub_id=$AZURE_SUB_DEV_QA"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_DEV_QA" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_DEV_QA"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_DEV_QA"             >> "$GITHUB_OUTPUT"
          else
            echo "sub_id=$AZURE_SUB_STAGING_PROD"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_STAGING_PROD" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_STAGING_PROD"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_STAGING_PROD"             >> "$GITHUB_OUTPUT"
          fi
          CONTAINER=$(jq -r ".subscriptions[\"$ALIAS\"].state_container" config/global/subscriptions.json)
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: ${{ needs._config.outputs.terraform_version }}
          working_directory: terraform/databricks
          environment: ${{ matrix.environment }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.team }}-${{ matrix.environment }}
          path: terraform/databricks/

      - name: Terraform init
        working-directory: terraform/databricks
        env:
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          RESOURCE_GROUP: ${{ steps.sub.outputs.rg }}
          CONTAINER: ${{ steps.sub.outputs.container }}
          STATE_KEY: "workspace/${{ matrix.team }}/${{ matrix.environment }}.tfstate"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=$STATE_KEY"

      - name: Terraform apply
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: terraform apply -input=false tfplan

      - name: Notify Teams
        if: always()
        uses: ./.github/actions/teams-notification
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: ${{ job.status }}
          environment: "${{ matrix.team }} / ${{ matrix.environment }}"
          message: "Databricks workspace apply ${{ job.status }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Apply — staging and prod: requires manual approval via GitHub environment
  # ─────────────────────────────────────────────────────────────────────────────
  apply-upper:
    name: "Apply · ${{ matrix.team }} / ${{ matrix.environment }}"
    needs: [_config, detect-changes, plan]
    if: |
      needs.detect-changes.outputs.has-upper == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    environment: databricks-${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix-upper) }}
    env:
      AZURE_SUB_DEV_QA: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
      AZURE_CLIENT_DEV_QA: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
      AZURE_SUB_STAGING_PROD: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
      AZURE_CLIENT_STAGING_PROD: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
      TF_SA_DEV_QA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
      TF_SA_STAGING_PROD: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
      TF_RG_DEV_QA: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
      TF_RG_STAGING_PROD: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve subscription credentials
        id: sub
        run: |
          ALIAS="${{ matrix.subscription_alias }}"
          if [[ "$ALIAS" == "dev-qa" ]]; then
            echo "sub_id=$AZURE_SUB_DEV_QA"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_DEV_QA" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_DEV_QA"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_DEV_QA"             >> "$GITHUB_OUTPUT"
          else
            echo "sub_id=$AZURE_SUB_STAGING_PROD"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_STAGING_PROD" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_STAGING_PROD"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_STAGING_PROD"             >> "$GITHUB_OUTPUT"
          fi
          CONTAINER=$(jq -r ".subscriptions[\"$ALIAS\"].state_container" config/global/subscriptions.json)
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: ${{ needs._config.outputs.terraform_version }}
          working_directory: terraform/databricks
          environment: ${{ matrix.environment }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.team }}-${{ matrix.environment }}
          path: terraform/databricks/

      - name: Terraform init
        working-directory: terraform/databricks
        env:
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          RESOURCE_GROUP: ${{ steps.sub.outputs.rg }}
          CONTAINER: ${{ steps.sub.outputs.container }}
          STATE_KEY: "workspace/${{ matrix.team }}/${{ matrix.environment }}.tfstate"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=$STATE_KEY"

      - name: Terraform apply
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: terraform apply -input=false tfplan

      - name: Notify Teams
        if: always()
        uses: ./.github/actions/teams-notification
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: ${{ job.status }}
          environment: "${{ matrix.team }} / ${{ matrix.environment }}"
          message: "Databricks workspace apply ${{ job.status }}"
