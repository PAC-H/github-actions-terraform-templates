name: Terraform State Management

# Manual state operations for the multi-team Databricks workspaces:
#   unlock | list | show | remove | backup | restore
# All ops target a single {team, environment} except `backup`, which on schedule
# iterates every team × env under config/teams/.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'State operation'
        required: true
        type: choice
        options:
          - unlock
          - list
          - show
          - remove
          - backup
          - restore
      team:
        description: "Team name (folder under config/teams/). Ignored for scheduled backup."
        required: false
      environment:
        description: 'Environment (dev|qa|staging|prod)'
        required: false
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      lock_id:
        description: 'Lock ID (required for unlock)'
        required: false
      resource_address:
        description: 'Resource address (required for show/remove, e.g. azurerm_databricks_workspace.this)'
        required: false
      backup_name:
        description: 'Backup blob name (required for restore)'
        required: false
  schedule:
    - cron: '0 2 * * 0'  # Weekly backup, Sundays 02:00 UTC

permissions:
  id-token: write
  contents: read

jobs:
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
      terraform_version: ${{ steps.load.outputs.terraform_version }}
      backup_account: ${{ steps.load.outputs.backup_account }}
      backup_container: ${{ steps.load.outputs.backup_container }}
      approval_envs: ${{ steps.load.outputs.approval_envs }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          TF_VERSION=$(jq -r '.terraform.version' config/global/base.json)
          BACKUP_ACCOUNT=$(jq -r '.storage.backup_account' config/global/base.json)
          BACKUP_CONTAINER=$(jq -r '.storage.backup_container' config/global/base.json)
          APPROVAL_ENVS=$(jq -c '[.environments | to_entries[] | select(.value.requires_approval) | .key]' config/global/subscriptions.json)
          echo "runners=$RUNNERS"                   >> "$GITHUB_OUTPUT"
          echo "terraform_version=$TF_VERSION"      >> "$GITHUB_OUTPUT"
          echo "backup_account=$BACKUP_ACCOUNT"     >> "$GITHUB_OUTPUT"
          echo "backup_container=$BACKUP_CONTAINER" >> "$GITHUB_OUTPUT"
          echo "approval_envs=$APPROVAL_ENVS"       >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Single-slice operations: unlock | list | show | remove | restore + manual backup
  # ───────────────────────────────────────────────────────────────────────────
  state-op:
    name: "State · ${{ github.event.inputs.operation }} · ${{ github.event.inputs.team }} / ${{ github.event.inputs.environment }}"
    if: github.event_name == 'workflow_dispatch'
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    environment: ${{ contains(fromJson(needs._config.outputs.approval_envs), github.event.inputs.environment) && format('databricks-{0}', github.event.inputs.environment) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          OP: ${{ github.event.inputs.operation }}
          TEAM: ${{ github.event.inputs.team }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "$TEAM" ]] || fail "team input is required"
          [[ -n "$ENVIRONMENT" ]] || fail "environment input is required"

          case "$OP" in
            unlock)
              [[ -n "${{ github.event.inputs.lock_id }}" ]]          || fail "lock_id required for unlock"
              ;;
            show|remove)
              [[ -n "${{ github.event.inputs.resource_address }}" ]] || fail "resource_address required for $OP"
              ;;
            restore)
              [[ -n "${{ github.event.inputs.backup_name }}" ]]      || fail "backup_name required for restore"
              ;;
          esac

          TEAM_DIR="config/teams/${TEAM}"
          ENV_FILE="${TEAM_DIR}/envs/${ENVIRONMENT}.tfvars"
          [[ -f "${TEAM_DIR}/common.tfvars" ]] || fail "missing ${TEAM_DIR}/common.tfvars"
          [[ -f "$ENV_FILE" ]]                 || fail "missing $ENV_FILE"

      - name: Resolve env to subscription alias
        id: alias
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          a=$(jq -r ".environments[\"$ENVIRONMENT\"].subscription // empty" config/global/subscriptions.json)
          [[ -n "$a" ]] || { echo "::error::No subscription alias for env '$ENVIRONMENT'"; exit 1; }
          echo "alias=$a" >> "$GITHUB_OUTPUT"

      - name: Resolve subscription credentials
        id: sub
        uses: ./.github/actions/resolve-subscription
        with:
          subscription_alias: ${{ steps.alias.outputs.alias }}
          azure_sub_dev_qa: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
          azure_client_dev_qa: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
          azure_sub_staging_prod: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
          azure_client_staging_prod: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
          tf_sa_dev_qa: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
          tf_sa_staging_prod: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
          tf_rg_dev_qa: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
          tf_rg_staging_prod: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        if: github.event.inputs.operation != 'restore'
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: ${{ needs._config.outputs.terraform_version }}
          working_directory: terraform/databricks
          environment: ${{ github.event.inputs.environment }}

      - name: Terraform init
        if: github.event.inputs.operation != 'restore'
        uses: ./.github/actions/terraform-init
        with:
          working_directory: terraform/databricks
          storage_account: ${{ steps.sub.outputs.sa }}
          container: ${{ steps.sub.outputs.container }}
          resource_group: ${{ steps.sub.outputs.rg }}
          state_key: "workspace/${{ github.event.inputs.team }}/${{ github.event.inputs.environment }}.tfstate"
          client_id: ${{ steps.sub.outputs.client_id }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ steps.sub.outputs.sub_id }}

      - name: Unlock
        if: github.event.inputs.operation == 'unlock'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: terraform force-unlock -force "${{ github.event.inputs.lock_id }}"

      - name: List
        if: github.event.inputs.operation == 'list'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          OUT="state-list-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}.txt"
          terraform state list | tee "$OUT"

      - name: Show
        if: github.event.inputs.operation == 'show'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          OUT="state-show-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}.txt"
          terraform state show "${{ github.event.inputs.resource_address }}" | tee "$OUT"

      - name: Remove (with safety backup)
        if: github.event.inputs.operation == 'remove'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          set -euo pipefail
          if ! terraform state list | grep -qx "${{ github.event.inputs.resource_address }}"; then
            echo "::error::Resource not in state"
            terraform state list
            exit 1
          fi
          TS=$(date +%Y%m%d-%H%M%S)
          terraform state pull > "pre-remove-${TS}.tfstate"
          terraform state show "${{ github.event.inputs.resource_address }}" > "removed-${TS}.txt"
          terraform state rm "${{ github.event.inputs.resource_address }}"
          terraform state list

      - name: Manual backup (single slice)
        if: github.event.inputs.operation == 'backup'
        env:
          BACKUP_ACCOUNT: ${{ needs._config.outputs.backup_account }}
          BACKUP_CONTAINER: ${{ needs._config.outputs.backup_container }}
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          CONTAINER: ${{ steps.sub.outputs.container }}
        run: |
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          KEY="workspace/${{ github.event.inputs.team }}/${{ github.event.inputs.environment }}.tfstate"
          OUT="${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-${TS}.tfstate"

          az storage blob download \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$KEY" \
            --file "$OUT"

          az storage blob upload \
            --auth-mode login \
            --account-name "$BACKUP_ACCOUNT" \
            --container-name "$BACKUP_CONTAINER" \
            --name "$OUT" \
            --file "$OUT"

      - name: Restore
        if: github.event.inputs.operation == 'restore'
        env:
          BACKUP_ACCOUNT: ${{ needs._config.outputs.backup_account }}
          BACKUP_CONTAINER: ${{ needs._config.outputs.backup_container }}
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          CONTAINER: ${{ steps.sub.outputs.container }}
        run: |
          set -euo pipefail
          KEY="workspace/${{ github.event.inputs.team }}/${{ github.event.inputs.environment }}.tfstate"
          TS=$(date +%Y%m%d-%H%M%S)
          PRE_RESTORE="${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-pre-restore-${TS}.tfstate"

          # Safety backup: snapshot current state to the backup container before overwriting it.
          echo "Snapshotting current state to ${BACKUP_CONTAINER}/${PRE_RESTORE}"
          if az storage blob download \
               --auth-mode login \
               --account-name "$STORAGE_ACCOUNT" \
               --container-name "$CONTAINER" \
               --name "$KEY" \
               --file "$PRE_RESTORE"; then
            az storage blob upload \
              --auth-mode login \
              --account-name "$BACKUP_ACCOUNT" \
              --container-name "$BACKUP_CONTAINER" \
              --name "$PRE_RESTORE" \
              --file "$PRE_RESTORE"
          else
            echo "::warning::No existing state at $KEY — nothing to back up before restore."
          fi

          az storage blob download \
            --auth-mode login \
            --account-name "$BACKUP_ACCOUNT" \
            --container-name "$BACKUP_CONTAINER" \
            --name "${{ github.event.inputs.backup_name }}" \
            --file restored.tfstate

          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$KEY" \
            --file restored.tfstate \
            --overwrite

      - name: Upload artifacts
        if: always() && github.event.inputs.operation != 'restore' && github.event.inputs.operation != 'unlock'
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.event.inputs.operation }}-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: |
            terraform/databricks/state-list-*.txt
            terraform/databricks/state-show-*.txt
            terraform/databricks/pre-remove-*.tfstate
            terraform/databricks/removed-*.txt
            *.tfstate
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify
        if: always()
        uses: ./.github/actions/teams-notification
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: ${{ job.status }}
          environment: "${{ github.event.inputs.team }} / ${{ github.event.inputs.environment }}"
          message: "State ${{ github.event.inputs.operation }} ${{ job.status }}"

  # ───────────────────────────────────────────────────────────────────────────
  # Scheduled weekly backup: iterates every team × env
  # ───────────────────────────────────────────────────────────────────────────
  build-backup-matrix:
    name: Build backup matrix
    if: github.event_name == 'schedule'
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-pairs: ${{ steps.matrix.outputs.has-pairs }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          set -euo pipefail
          pairs=()
          for team_dir in config/teams/*/; do
            team=$(basename "$team_dir")
            [[ "$team" == _* ]] && continue
            env_dir="${team_dir}envs"
            [[ -d "$env_dir" ]] || continue
            for env_file in "$env_dir"/*.tfvars; do
              [[ -e "$env_file" ]] || continue
              env=$(basename "$env_file" .tfvars)
              alias=$(jq -r ".environments[\"$env\"].subscription // empty" config/global/subscriptions.json)
              [[ -n "$alias" ]] || continue
              pairs+=("{\"team\":\"${team}\",\"environment\":\"${env}\",\"subscription_alias\":\"${alias}\"}")
            done
          done
          if [[ ${#pairs[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-pairs=false"          >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${pairs[*]}")
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo "has-pairs=true"                    >> "$GITHUB_OUTPUT"
          fi

  scheduled-backup:
    name: "Backup · ${{ matrix.team }} / ${{ matrix.environment }}"
    if: github.event_name == 'schedule' && needs.build-backup-matrix.outputs.has-pairs == 'true'
    needs: [_config, build-backup-matrix]
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-backup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve subscription credentials
        id: sub
        uses: ./.github/actions/resolve-subscription
        with:
          subscription_alias: ${{ matrix.subscription_alias }}
          azure_sub_dev_qa: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
          azure_client_dev_qa: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
          azure_sub_staging_prod: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
          azure_client_staging_prod: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
          tf_sa_dev_qa: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
          tf_sa_staging_prod: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Copy state to backup container
        env:
          BACKUP_ACCOUNT: ${{ needs._config.outputs.backup_account }}
          BACKUP_CONTAINER: ${{ needs._config.outputs.backup_container }}
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          CONTAINER: ${{ steps.sub.outputs.container }}
        run: |
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          KEY="workspace/${{ matrix.team }}/${{ matrix.environment }}.tfstate"
          OUT="${{ matrix.team }}-${{ matrix.environment }}-${TS}.tfstate"

          az storage blob download \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$KEY" \
            --file "$OUT" || { echo "::warning::No state at $KEY, skipping"; exit 0; }

          az storage blob upload \
            --auth-mode login \
            --account-name "$BACKUP_ACCOUNT" \
            --container-name "$BACKUP_CONTAINER" \
            --name "$OUT" \
            --file "$OUT"
