name: Terraform Testing

# Static checks for the Databricks Terraform code:
#   - terraform fmt -check across the whole tree
#   - terraform validate on the root and the module
#   - tflint on both
# No Azure resources are created.

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-testing.yml'

permissions:
  id-token: write
  contents: read

jobs:
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          echo "runners=$RUNNERS" >> "$GITHUB_OUTPUT"

  static-checks:
    name: fmt + validate + tflint
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          working_directory: terraform/databricks
          environment: dev

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ./terraform

      - name: terraform validate (root)
        working-directory: terraform/databricks
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (module)
        working-directory: terraform/modules/databricks-workspace
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Install tflint
        run: curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: tflint root
        working-directory: terraform/databricks
        run: |
          tflint --init
          tflint --format compact

      - name: tflint module
        working-directory: terraform/modules/databricks-workspace
        run: |
          tflint --init
          tflint --format compact
