name: Terraform Utilities

# Operations against the multi-team Databricks root:
#   tfupdate          — auto-update azurerm provider, open PR
#   dependency-graph  — render terraform graph for a team × env
#   target-apply      — apply a subset of resources
#   target-destroy    — destroy a subset of resources
#   import-individual — import one resource into state
#   import-bulk       — import many from a JSON file
#   import-dry-run    — validate an import plan without executing

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation'
        required: true
        type: choice
        options:
          - tfupdate
          - dependency-graph
          - target-apply
          - target-destroy
          - import-individual
          - import-bulk
          - import-dry-run
      team:
        description: "Team name (folder under config/teams/). Required for everything except tfupdate."
        required: false
      environment:
        description: 'Environment (dev|qa|staging|prod). Required for everything except tfupdate.'
        required: false
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      target_resources:
        description: 'Comma-separated target addresses (for target-apply/destroy)'
        required: false
      import_resource_address:
        description: 'Terraform resource address (for import-individual)'
        required: false
      import_resource_id:
        description: 'Azure resource ID (for import-individual)'
        required: false
      import_config_file:
        description: "Bulk-import config file (e.g. config/imports/<team>/<env>-imports.json)"
        required: false
  push:
    paths:
      - 'terraform/databricks/**'
      - 'terraform/modules/databricks-workspace/**'
    branches: [develop, main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          echo "runners=$RUNNERS" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # tfupdate — single root, no per-env duplication
  # ───────────────────────────────────────────────────────────────────────────
  tfupdate:
    name: tfupdate
    if: github.event.inputs.operation == 'tfupdate' || github.event_name == 'push'
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tfupdate
        run: |
          curl -fsSL https://github.com/minamijoyo/tfupdate/releases/download/v0.7.1/tfupdate_0.7.1_linux_amd64.tar.gz | tar -xz
          sudo mv tfupdate /usr/local/bin/

      - name: Update providers
        run: |
          tfupdate provider azurerm --version "> 4.30.0, < 5.0" ./terraform/databricks
          tfupdate provider azurerm --version "> 4.30.0, < 5.0" ./terraform/modules/databricks-workspace

      - name: Check for updates
        id: check
        run: |
          if git diff --quiet; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.check.outputs.has_updates == 'true' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: tfupdate providers"
          title: "chore: tfupdate providers"
          body: |
            Automated provider version bumps via `tfupdate` for `terraform/databricks/` and `terraform/modules/databricks-workspace/`.
          branch: tfupdate/${{ github.run_number }}

  # ───────────────────────────────────────────────────────────────────────────
  # Slice-targeted ops — all share the same setup: validate inputs, resolve sub, init
  # ───────────────────────────────────────────────────────────────────────────
  slice-op:
    name: "${{ github.event.inputs.operation }} · ${{ github.event.inputs.team }} / ${{ github.event.inputs.environment }}"
    if: |
      github.event.inputs.operation == 'dependency-graph' ||
      github.event.inputs.operation == 'target-apply'    ||
      github.event.inputs.operation == 'target-destroy'  ||
      github.event.inputs.operation == 'import-individual' ||
      github.event.inputs.operation == 'import-bulk' ||
      github.event.inputs.operation == 'import-dry-run'
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    environment: ${{ (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'prod') && format('databricks-{0}', github.event.inputs.environment) || '' }}
    env:
      AZURE_SUB_DEV_QA: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
      AZURE_CLIENT_DEV_QA: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
      AZURE_SUB_STAGING_PROD: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
      AZURE_CLIENT_STAGING_PROD: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
      TF_SA_DEV_QA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
      TF_SA_STAGING_PROD: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
      TF_RG_DEV_QA: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
      TF_RG_STAGING_PROD: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          OP: ${{ github.event.inputs.operation }}
          TEAM: ${{ github.event.inputs.team }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "$TEAM" ]]        || fail "team input is required"
          [[ -n "$ENVIRONMENT" ]] || fail "environment input is required"

          TEAM_DIR="config/teams/${TEAM}"
          [[ -f "${TEAM_DIR}/common.tfvars"  ]]         || fail "missing ${TEAM_DIR}/common.tfvars"
          [[ -f "${TEAM_DIR}/envs/${ENVIRONMENT}.tfvars" ]] || fail "missing ${TEAM_DIR}/envs/${ENVIRONMENT}.tfvars"

          case "$OP" in
            target-apply|target-destroy)
              [[ -n "${{ github.event.inputs.target_resources }}" ]] || fail "target_resources required for $OP"
              ;;
            import-individual)
              [[ -n "${{ github.event.inputs.import_resource_address }}" ]] || fail "import_resource_address required"
              [[ -n "${{ github.event.inputs.import_resource_id }}" ]]      || fail "import_resource_id required"
              ;;
            import-bulk|import-dry-run)
              FILE="${{ github.event.inputs.import_config_file }}"
              [[ -n "$FILE" ]] || fail "import_config_file required"
              [[ -f "$FILE" ]] || fail "import_config_file not found: $FILE"
              jq empty "$FILE" 2>/dev/null || fail "import_config_file is not valid JSON"
              ;;
          esac

      - name: Resolve subscription credentials
        id: sub
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          ALIAS=$(jq -r ".env_to_subscription[\"$ENVIRONMENT\"]" config/global/subscriptions.json)
          if [[ "$ALIAS" == "dev-qa" ]]; then
            echo "sub_id=$AZURE_SUB_DEV_QA"           >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_DEV_QA"     >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_DEV_QA"                   >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_DEV_QA"                   >> "$GITHUB_OUTPUT"
          else
            echo "sub_id=$AZURE_SUB_STAGING_PROD"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_STAGING_PROD" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_STAGING_PROD"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_STAGING_PROD"             >> "$GITHUB_OUTPUT"
          fi
          CONTAINER=$(jq -r ".subscriptions[\"$ALIAS\"].state_container" config/global/subscriptions.json)
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          working_directory: terraform/databricks
          environment: ${{ github.event.inputs.environment }}

      - name: Terraform init
        working-directory: terraform/databricks
        env:
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          RESOURCE_GROUP: ${{ steps.sub.outputs.rg }}
          CONTAINER: ${{ steps.sub.outputs.container }}
          STATE_KEY: "workspace/${{ github.event.inputs.team }}/${{ github.event.inputs.environment }}.tfstate"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=$STATE_KEY"

      # ── dependency-graph ──────────────────────────────────────────────────
      - name: Install graphviz
        if: github.event.inputs.operation == 'dependency-graph'
        run: sudo apt-get update -y && sudo apt-get install -y graphviz

      - name: Generate dependency graph
        if: github.event.inputs.operation == 'dependency-graph'
        working-directory: terraform/databricks
        run: |
          OUT="dependency-graph-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}"
          terraform graph | dot -Tsvg > "${OUT}.svg"
          terraform graph | dot -Tpng > "${OUT}.png"

      # ── target-apply / target-destroy ─────────────────────────────────────
      - name: Build target flags
        if: github.event.inputs.operation == 'target-apply' || github.event.inputs.operation == 'target-destroy'
        id: targets
        run: |
          FLAGS=""
          IFS=',' read -ra ARR <<< "${{ github.event.inputs.target_resources }}"
          for t in "${ARR[@]}"; do
            FLAGS="$FLAGS -target=$(echo "$t" | xargs)"
          done
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Target plan
        if: github.event.inputs.operation == 'target-apply' || github.event.inputs.operation == 'target-destroy'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          DESTROY_FLAG=""
          [[ "${{ github.event.inputs.operation }}" == "target-destroy" ]] && DESTROY_FLAG="-destroy"
          terraform plan $DESTROY_FLAG ${{ steps.targets.outputs.flags }} \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            -out=target.tfplan -input=false

      - name: Target apply
        if: github.event.inputs.operation == 'target-apply' || github.event.inputs.operation == 'target-destroy'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: terraform apply -input=false target.tfplan

      # ── imports ──────────────────────────────────────────────────────────
      - name: Pre-import state backup
        if: github.event.inputs.operation == 'import-individual' || github.event.inputs.operation == 'import-bulk'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          BACKUP="pre-import-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-${TS}.tfstate"
          terraform state pull > "$BACKUP"
          echo "BACKUP_NAME=$BACKUP" >> "$GITHUB_ENV"

      - name: Import dry-run
        if: github.event.inputs.operation == 'import-dry-run' || github.event.inputs.operation == 'import-bulk'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          set -euo pipefail
          CONFIG="../../${{ github.event.inputs.import_config_file }}"
          REPORT="import-validation-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}.md"
          {
            echo "# Import validation"
            echo "- Team: ${{ github.event.inputs.team }}"
            echo "- Env:  ${{ github.event.inputs.environment }}"
            echo "- File: ${{ github.event.inputs.import_config_file }}"
            echo ""
          } > "$REPORT"
          COUNT=$(jq '.imports | length' "$CONFIG")
          for i in $(seq 0 $((COUNT - 1))); do
            ADDR=$(jq -r ".imports[$i].resource_address" "$CONFIG")
            ID=$(jq -r ".imports[$i].resource_id" "$CONFIG")
            echo "## $ADDR" >> "$REPORT"
            if terraform state show "$ADDR" >/dev/null 2>&1; then
              echo "- Already in state (will be skipped)" >> "$REPORT"
            elif az resource show --ids "$ID" >/dev/null 2>&1; then
              echo "- Ready for import" >> "$REPORT"
            else
              echo "- Azure resource NOT found" >> "$REPORT"
            fi
          done

      - name: Execute import-individual
        if: github.event.inputs.operation == 'import-individual'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform import \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            "${{ github.event.inputs.import_resource_address }}" \
            "${{ github.event.inputs.import_resource_id }}"

      - name: Execute import-bulk
        if: github.event.inputs.operation == 'import-bulk'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          set -euo pipefail
          CONFIG="../../${{ github.event.inputs.import_config_file }}"
          COUNT=$(jq '.imports | length' "$CONFIG")
          ok=0; fail=0
          for i in $(seq 0 $((COUNT - 1))); do
            ADDR=$(jq -r ".imports[$i].resource_address" "$CONFIG")
            ID=$(jq -r ".imports[$i].resource_id" "$CONFIG")
            if terraform state show "$ADDR" >/dev/null 2>&1; then
              echo "Skip (in state): $ADDR"; continue
            fi
            if terraform import \
                 -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
                 -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
                 "$ADDR" "$ID"; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
            fi
          done
          echo "Bulk import: $ok successful, $fail failed"
          [[ $fail -eq 0 ]]

      - name: Post-import verify
        if: github.event.inputs.operation == 'import-individual' || github.event.inputs.operation == 'import-bulk'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          set +e
          terraform plan -detailed-exitcode \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            -out=post-import.tfplan -input=false
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]] || exit 1

      # ── artifacts + notify ───────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utilities-${{ github.event.inputs.operation }}-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: |
            terraform/databricks/dependency-graph-*.svg
            terraform/databricks/dependency-graph-*.png
            terraform/databricks/target.tfplan
            terraform/databricks/post-import.tfplan
            terraform/databricks/pre-import-*.tfstate
            terraform/databricks/import-validation-*.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify
        if: always()
        uses: ./.github/actions/teams-notification
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: ${{ job.status }}
          environment: "${{ github.event.inputs.team }} / ${{ github.event.inputs.environment }}"
          message: "${{ github.event.inputs.operation }} ${{ job.status }}"
