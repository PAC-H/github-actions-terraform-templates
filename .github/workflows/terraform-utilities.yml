name: Terraform Utilities

# Operations against the multi-team Databricks root:
#   tfupdate          — auto-update azurerm provider, open PR
#   dependency-graph  — render terraform graph for a team × env
#   target-apply      — apply a subset of resources
#   target-destroy    — destroy a subset of resources
#   import-plan       — config-driven import preview: renders import{} blocks, runs
#                       `terraform plan -generate-config-out`, uploads the generated
#                       HCL + plan for review. No state change.
#   import-apply      — performs the config-driven import via plan -out + apply.
#
# import-plan/import-apply take EITHER a bulk file (import_config_file) OR a single
# resource_address + resource_id pair. Both render `import {}` blocks (Terraform >= 1.5)
# rather than the legacy imperative `terraform import` command.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation'
        required: true
        type: choice
        options:
          - tfupdate
          - dependency-graph
          - target-apply
          - target-destroy
          - import-plan
          - import-apply
      team:
        description: "Team name (folder under config/teams/). Required for everything except tfupdate."
        required: false
      environment:
        description: 'Environment (dev|qa|staging|prod). Required for everything except tfupdate.'
        required: false
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      target_resources:
        description: 'Comma-separated target addresses (for target-apply/destroy)'
        required: false
      import_resource_address:
        description: 'Single-import: Terraform resource address (use instead of import_config_file)'
        required: false
      import_resource_id:
        description: 'Single-import: Azure resource ID (use instead of import_config_file)'
        required: false
      import_config_file:
        description: "Bulk-import config file (e.g. config/imports/<team>/<env>-imports.json). Use instead of the resource_address/id pair."
        required: false
  push:
    paths:
      - 'terraform/databricks/**'
      - 'terraform/modules/databricks-workspace/**'
    branches: [develop, main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
      terraform_version: ${{ steps.load.outputs.terraform_version }}
      approval_envs: ${{ steps.load.outputs.approval_envs }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          TF_VERSION=$(jq -r '.terraform.version' config/global/base.json)
          APPROVAL_ENVS=$(jq -c '[.environments | to_entries[] | select(.value.requires_approval) | .key]' config/global/subscriptions.json)
          echo "runners=$RUNNERS"              >> "$GITHUB_OUTPUT"
          echo "terraform_version=$TF_VERSION" >> "$GITHUB_OUTPUT"
          echo "approval_envs=$APPROVAL_ENVS"  >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # tfupdate — single root, no per-env duplication
  # ───────────────────────────────────────────────────────────────────────────
  tfupdate:
    name: tfupdate
    if: github.event.inputs.operation == 'tfupdate' || github.event_name == 'push'
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tfupdate
        run: |
          curl -fsSL https://github.com/minamijoyo/tfupdate/releases/download/v0.7.1/tfupdate_0.7.1_linux_amd64.tar.gz | tar -xz
          sudo mv tfupdate /usr/local/bin/

      - name: Update providers
        run: |
          tfupdate provider azurerm --version "> 4.30.0, < 5.0" ./terraform/databricks
          tfupdate provider azurerm --version "> 4.30.0, < 5.0" ./terraform/modules/databricks-workspace

      - name: Check for updates
        id: check
        run: |
          if git diff --quiet; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: tfupdate providers"
          title: "chore: tfupdate providers"
          body: |
            Automated provider version bumps via `tfupdate` for `terraform/databricks/` and `terraform/modules/databricks-workspace/`.
          branch: tfupdate/${{ github.run_number }}

  # ───────────────────────────────────────────────────────────────────────────
  # Slice-targeted ops — all share the same setup: validate inputs, resolve sub, init
  # ───────────────────────────────────────────────────────────────────────────
  slice-op:
    name: "${{ github.event.inputs.operation }} · ${{ github.event.inputs.team }} / ${{ github.event.inputs.environment }}"
    if: |
      github.event.inputs.operation == 'dependency-graph' ||
      github.event.inputs.operation == 'target-apply'    ||
      github.event.inputs.operation == 'target-destroy'  ||
      github.event.inputs.operation == 'import-plan' ||
      github.event.inputs.operation == 'import-apply'
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    environment: ${{ contains(fromJson(needs._config.outputs.approval_envs), github.event.inputs.environment) && format('databricks-{0}', github.event.inputs.environment) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          OP: ${{ github.event.inputs.operation }}
          TEAM: ${{ github.event.inputs.team }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "$TEAM" ]]        || fail "team input is required"
          [[ -n "$ENVIRONMENT" ]] || fail "environment input is required"

          case "$OP" in
            target-apply|target-destroy)
              [[ -n "${{ github.event.inputs.target_resources }}" ]] || fail "target_resources required for $OP"
              ;;
            import-plan|import-apply)
              FILE="${{ github.event.inputs.import_config_file }}"
              ADDR="${{ github.event.inputs.import_resource_address }}"
              ID="${{ github.event.inputs.import_resource_id }}"
              if [[ -n "$FILE" ]]; then
                [[ -z "$ADDR" && -z "$ID" ]] || fail "provide either import_config_file OR the address/id pair, not both"
                [[ -f "$FILE" ]] || fail "import_config_file not found: $FILE"
                jq empty "$FILE" 2>/dev/null || fail "import_config_file is not valid JSON"
                jq -e '.imports | type == "array" and length > 0' "$FILE" >/dev/null \
                  || fail "import_config_file must contain a non-empty .imports array"
              else
                [[ -n "$ADDR" ]] || fail "import_resource_address required (or supply import_config_file)"
                [[ -n "$ID" ]]   || fail "import_resource_id required (or supply import_config_file)"
              fi
              ;;
          esac

      - name: Resolve env to subscription alias
        id: alias
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          a=$(jq -r ".environments[\"$ENVIRONMENT\"].subscription // empty" config/global/subscriptions.json)
          [[ -n "$a" ]] || { echo "::error::No subscription alias for env '$ENVIRONMENT'"; exit 1; }
          echo "alias=$a" >> "$GITHUB_OUTPUT"

      - name: Prepare Terraform context
        id: ctx
        uses: ./.github/actions/prepare-terraform
        with:
          subscription_alias: ${{ steps.alias.outputs.alias }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_sub_dev_qa: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
          azure_client_dev_qa: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
          azure_sub_staging_prod: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
          azure_client_staging_prod: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
          tf_sa_dev_qa: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
          tf_sa_staging_prod: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
          tf_rg_dev_qa: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
          tf_rg_staging_prod: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}
          validate_team_files: 'true'
          team: ${{ github.event.inputs.team }}
          environment: ${{ github.event.inputs.environment }}
          terraform_version: ${{ needs._config.outputs.terraform_version }}
          working_directory: terraform/databricks
          state_key: "workspace/${{ github.event.inputs.team }}/${{ github.event.inputs.environment }}.tfstate"

      # ── dependency-graph ──────────────────────────────────────────────────
      - name: Install graphviz
        if: github.event.inputs.operation == 'dependency-graph'
        run: sudo apt-get update -y && sudo apt-get install -y graphviz

      - name: Generate dependency graph
        if: github.event.inputs.operation == 'dependency-graph'
        working-directory: terraform/databricks
        run: |
          OUT="dependency-graph-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}"
          terraform graph | dot -Tsvg > "${OUT}.svg"
          terraform graph | dot -Tpng > "${OUT}.png"

      # ── target-apply / target-destroy ─────────────────────────────────────
      - name: Build target flags
        if: github.event.inputs.operation == 'target-apply' || github.event.inputs.operation == 'target-destroy'
        id: targets
        run: |
          FLAGS=""
          IFS=',' read -ra ARR <<< "${{ github.event.inputs.target_resources }}"
          for t in "${ARR[@]}"; do
            FLAGS="$FLAGS -target=$(echo "$t" | xargs)"
          done
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Target plan
        if: github.event.inputs.operation == 'target-apply' || github.event.inputs.operation == 'target-destroy'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.ctx.outputs.sub_id }}
        run: |
          DESTROY_FLAG=""
          [[ "${{ github.event.inputs.operation }}" == "target-destroy" ]] && DESTROY_FLAG="-destroy"
          terraform plan $DESTROY_FLAG ${{ steps.targets.outputs.flags }} \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            -out=target.tfplan -input=false

      - name: Target apply
        if: github.event.inputs.operation == 'target-apply' || github.event.inputs.operation == 'target-destroy'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
        run: terraform apply -input=false target.tfplan

      # ── imports (config-driven: import {} blocks + generate-config-out) ───
      # Renders Terraform `import {}` blocks (>= 1.5) from either a bulk JSON file
      # or the single address/id pair, then previews (import-plan) or performs
      # (import-apply) the import through the normal plan/apply lifecycle.
      - name: Render import blocks
        if: github.event.inputs.operation == 'import-plan' || github.event.inputs.operation == 'import-apply'
        working-directory: terraform/databricks
        env:
          IMPORT_FILE: ${{ github.event.inputs.import_config_file }}
          IMPORT_ADDR: ${{ github.event.inputs.import_resource_address }}
          IMPORT_ID: ${{ github.event.inputs.import_resource_id }}
        run: |
          set -euo pipefail
          OUT="generated_imports.tf"
          {
            echo "# AUTO-GENERATED by terraform-utilities.yml — ephemeral, do not commit."
            echo "# Source: ${IMPORT_FILE:-inline address/id inputs}"
          } > "$OUT"
          emit() {
            local addr="$1" id="$2"
            [[ -n "$addr" && "$addr" != "null" ]] || { echo "::error::empty import resource_address"; exit 1; }
            [[ -n "$id"   && "$id"   != "null" ]] || { echo "::error::empty import resource_id";      exit 1; }
            printf 'import {\n  to = %s\n  id = "%s"\n}\n' "$addr" "$id" >> "$OUT"
          }
          if [[ -n "$IMPORT_FILE" ]]; then
            CONFIG="../../$IMPORT_FILE"
            COUNT=$(jq '.imports | length' "$CONFIG")
            for i in $(seq 0 $((COUNT - 1))); do
              emit "$(jq -r ".imports[$i].resource_address" "$CONFIG")" \
                   "$(jq -r ".imports[$i].resource_id" "$CONFIG")"
            done
          else
            emit "$IMPORT_ADDR" "$IMPORT_ID"
          fi
          echo "Rendered import blocks:"
          cat "$OUT"

      - name: Pre-import state backup
        if: github.event.inputs.operation == 'import-apply'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          BACKUP="pre-import-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-${TS}.tfstate"
          terraform state pull > "$BACKUP"
          echo "Pre-import state backup written to $BACKUP (uploaded via artifact glob)"

      # import-plan: preview only. `-generate-config-out` writes HCL for any import
      # target that does not yet have a resource block (already-coded resources, like
      # the module workspace, yield an empty file — that is expected and correct).
      # It cannot be combined with -out, so this phase saves no plan and changes no state.
      - name: Import plan + generate config
        if: github.event.inputs.operation == 'import-plan'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.ctx.outputs.sub_id }}
        run: |
          set -euo pipefail
          rm -f workspace.generated.tf
          set +e
          terraform plan \
            -generate-config-out=workspace.generated.tf \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            -input=false 2>&1 | tee import.plan.txt
          rc=${PIPESTATUS[0]}
          set -e
          [[ $rc -eq 0 ]] || { echo "::error::import plan failed (exit $rc)"; exit "$rc"; }
          if [[ -s workspace.generated.tf ]]; then
            echo "::notice::Generated HCL written to workspace.generated.tf — review it, then fold the resource(s) into the module before running import-apply."
          else
            echo "::notice::No config generated — every import target already has a resource block (expected for already-coded resources). Proceed to import-apply."
          fi
          echo "Reviewed via import.plan.txt + workspace.generated.tf (run artifacts). No state changed."

      # import-apply: perform the import through a saved plan, so the import is
      # reviewable in the plan output and applied atomically.
      - name: Import plan (for apply)
        if: github.event.inputs.operation == 'import-apply'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.ctx.outputs.sub_id }}
        run: |
          set -euo pipefail
          terraform plan \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            -out=import.tfplan -input=false 2>&1 | tee import.plan.txt

      - name: Import apply
        if: github.event.inputs.operation == 'import-apply'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
        run: terraform apply -input=false import.tfplan

      - name: Post-import verify
        if: github.event.inputs.operation == 'import-apply'
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.ctx.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.ctx.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.ctx.outputs.sub_id }}
        run: |
          set +e
          terraform plan -detailed-exitcode \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/common.tfvars \
            -var-file=../../config/teams/${{ github.event.inputs.team }}/envs/${{ github.event.inputs.environment }}.tfvars \
            -out=post-import.tfplan -input=false
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "Post-import plan clean — import fully captured the resource's existing config."
              ;;
            2)
              echo "::warning::Post-import plan still shows changes. The import may not fully capture the resource's existing config — inspect post-import.tfplan in the run artifacts and reconcile your Terraform code before applying."
              ;;
            *)
              echo "::error::Post-import plan failed (exit $rc)"
              exit 1
              ;;
          esac

      # ── artifacts + notify ───────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utilities-${{ github.event.inputs.operation }}-${{ github.event.inputs.team }}-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: |
            terraform/databricks/dependency-graph-*.svg
            terraform/databricks/dependency-graph-*.png
            terraform/databricks/target.tfplan
            terraform/databricks/post-import.tfplan
            terraform/databricks/pre-import-*.tfstate
            terraform/databricks/workspace.generated.tf
            terraform/databricks/generated_imports.tf
            terraform/databricks/import.tfplan
            terraform/databricks/import.plan.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify
        if: always()
        uses: ./.github/actions/teams-notification
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: ${{ job.status }}
          environment: "${{ github.event.inputs.team }} / ${{ github.event.inputs.environment }}"
          message: "${{ github.event.inputs.operation }} ${{ job.status }}"
