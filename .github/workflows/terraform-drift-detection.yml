name: Terraform Drift Detection

# Detects drift across every team × environment under config/teams/
# by running `terraform plan -detailed-exitcode` against the live backend.
# Runs weekly + on demand. Non-destructive.

on:
  schedule:
    - cron: '0 9 * * 0'  # Sundays 09:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          echo "runners=$RUNNERS" >> "$GITHUB_OUTPUT"

  build-matrix:
    name: Build team/env matrix
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-pairs: ${{ steps.matrix.outputs.has-pairs }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          set -euo pipefail
          pairs=()
          for team_dir in config/teams/*/; do
            team=$(basename "$team_dir")
            [[ "$team" == _* ]] && continue
            env_dir="${team_dir}envs"
            [[ -d "$env_dir" ]] || continue
            for env_file in "$env_dir"/*.tfvars; do
              [[ -e "$env_file" ]] || continue
              env=$(basename "$env_file" .tfvars)
              alias=$(jq -r ".env_to_subscription[\"$env\"] // empty" config/global/subscriptions.json)
              [[ -n "$alias" ]] || { echo "::warning::No subscription alias for env '$env', skipping ${team}/${env}"; continue; }
              pairs+=("{\"team\":\"${team}\",\"environment\":\"${env}\",\"subscription_alias\":\"${alias}\"}")
            done
          done

          if [[ ${#pairs[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-pairs=false"          >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${pairs[*]}")
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo "has-pairs=true"                    >> "$GITHUB_OUTPUT"
          fi

  drift:
    name: "Drift · ${{ matrix.team }} / ${{ matrix.environment }}"
    needs: [_config, build-matrix]
    if: needs.build-matrix.outputs.has-pairs == 'true'
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    env:
      AZURE_SUB_DEV_QA: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
      AZURE_CLIENT_DEV_QA: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
      AZURE_SUB_STAGING_PROD: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
      AZURE_CLIENT_STAGING_PROD: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
      TF_SA_DEV_QA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
      TF_SA_STAGING_PROD: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
      TF_RG_DEV_QA: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
      TF_RG_STAGING_PROD: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve subscription credentials
        id: sub
        run: |
          ALIAS="${{ matrix.subscription_alias }}"
          if [[ "$ALIAS" == "dev-qa" ]]; then
            echo "sub_id=$AZURE_SUB_DEV_QA"           >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_DEV_QA"     >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_DEV_QA"                   >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_DEV_QA"                   >> "$GITHUB_OUTPUT"
          else
            echo "sub_id=$AZURE_SUB_STAGING_PROD"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_STAGING_PROD" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_STAGING_PROD"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_STAGING_PROD"             >> "$GITHUB_OUTPUT"
          fi
          CONTAINER=$(jq -r ".subscriptions[\"$ALIAS\"].state_container" config/global/subscriptions.json)
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          working_directory: terraform/databricks
          environment: ${{ matrix.environment }}

      - name: Terraform init
        working-directory: terraform/databricks
        env:
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          RESOURCE_GROUP: ${{ steps.sub.outputs.rg }}
          CONTAINER: ${{ steps.sub.outputs.container }}
          STATE_KEY: "workspace/${{ matrix.team }}/${{ matrix.environment }}.tfstate"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=$STATE_KEY"

      - name: Check for drift
        id: check
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          set +e
          terraform plan \
            -var-file=../../config/teams/${{ matrix.team }}/common.tfvars \
            -var-file=../../config/teams/${{ matrix.team }}/envs/${{ matrix.environment }}.tfvars \
            -detailed-exitcode \
            -out=drift.tfplan \
            -input=false 2>&1 | tee drift.log
          TF_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$TF_EXIT" >> "$GITHUB_OUTPUT"
          if [[ $TF_EXIT -eq 0 ]]; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          elif [[ $TF_EXIT -eq 2 ]]; then
            echo "has_drift=true"  >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed"
            exit 1
          fi

      - name: Upload drift report
        if: steps.check.outputs.has_drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.team }}-${{ matrix.environment }}
          path: |
            terraform/databricks/drift.tfplan
            terraform/databricks/drift.log
          retention-days: 30

      - name: Notify drift
        if: steps.check.outputs.has_drift == 'true'
        uses: ./.github/actions/teams-notification
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: warning
          environment: "${{ matrix.team }} / ${{ matrix.environment }}"
          message: "Drift detected. See artifact drift-report-${{ matrix.team }}-${{ matrix.environment }}."
