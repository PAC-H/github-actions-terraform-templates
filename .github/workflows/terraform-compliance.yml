name: Terraform Compliance

# tflint + checkov + Azure Policy compliance check, per team × env.
# PR trigger: scans every changed team's matrix. Manual: pick team + env (or 'all').

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'terraform/**'
      - 'config/teams/**'
  workflow_dispatch:
    inputs:
      team:
        description: "Team name or 'all'"
        required: true
        default: 'all'
      environment:
        description: "Environment (dev|qa|staging|prod|all)"
        required: true
        default: 'all'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  _config:
    name: Load Config
    runs-on: [self-hosted, linux, x64]
    outputs:
      runners: ${{ steps.load.outputs.runners }}
      terraform_version: ${{ steps.load.outputs.terraform_version }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          RUNNERS=$(jq -c '.runners.labels' config/global/base.json)
          TF_VERSION=$(jq -r '.terraform.version' config/global/base.json)
          echo "runners=$RUNNERS"              >> "$GITHUB_OUTPUT"
          echo "terraform_version=$TF_VERSION" >> "$GITHUB_OUTPUT"

  build-matrix:
    name: Build team/env matrix
    needs: _config
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-pairs: ${{ steps.matrix.outputs.has-pairs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: matrix
        env:
          TEAM_INPUT: ${{ github.event.inputs.team || '' }}
          ENV_INPUT: ${{ github.event.inputs.environment || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          pairs=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$TEAM_INPUT" == "all" ]]; then
              teams=$(ls config/teams/ | grep -v '^_')
            else
              teams="$TEAM_INPUT"
            fi
          else
            # PR trigger — derive from changed files; module changes queue all teams
            base_sha="${{ github.event.pull_request.base.sha }}"
            changed=$(git diff --name-only "$base_sha" HEAD)
            if echo "$changed" | grep -qE "^terraform/(modules/databricks-workspace|databricks)/"; then
              teams=$(ls config/teams/ | grep -v '^_')
            else
              teams=$(echo "$changed" | grep "^config/teams/" | sed 's|config/teams/||;s|/.*||' | grep -v '^_' | sort -u || true)
            fi
          fi

          for team in $teams; do
            env_dir="config/teams/${team}/envs"
            [[ -d "$env_dir" ]] || continue
            all_envs=$(ls "$env_dir" 2>/dev/null | grep '\.tfvars$' | sed 's/\.tfvars$//' | sort)
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "$ENV_INPUT" != "all" ]]; then
              envs="$ENV_INPUT"
            else
              envs="$all_envs"
            fi
            for env in $envs; do
              echo "$all_envs" | grep -qx "$env" || continue
              alias=$(jq -r ".env_to_subscription[\"$env\"] // empty" config/global/subscriptions.json)
              [[ -n "$alias" ]] || continue
              pairs+=("{\"team\":\"${team}\",\"environment\":\"${env}\",\"subscription_alias\":\"${alias}\"}")
            done
          done

          if [[ ${#pairs[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-pairs=false"          >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${pairs[*]}")
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo "has-pairs=true"                    >> "$GITHUB_OUTPUT"
          fi

  compliance:
    name: "Compliance · ${{ matrix.team }} / ${{ matrix.environment }}"
    needs: [_config, build-matrix]
    if: needs.build-matrix.outputs.has-pairs == 'true'
    runs-on: ${{ fromJson(needs._config.outputs.runners) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    env:
      AZURE_SUB_DEV_QA: ${{ secrets.AZURE_SUBSCRIPTION_DEV_QA }}
      AZURE_CLIENT_DEV_QA: ${{ secrets.AZURE_CLIENT_ID_DEV_QA }}
      AZURE_SUB_STAGING_PROD: ${{ secrets.AZURE_SUBSCRIPTION_STAGING_PROD }}
      AZURE_CLIENT_STAGING_PROD: ${{ secrets.AZURE_CLIENT_ID_STAGING_PROD }}
      TF_SA_DEV_QA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_DEV_QA }}
      TF_SA_STAGING_PROD: ${{ secrets.TF_STATE_STORAGE_ACCOUNT_STAGING_PROD }}
      TF_RG_DEV_QA: ${{ secrets.TF_STATE_RESOURCE_GROUP_DEV_QA }}
      TF_RG_STAGING_PROD: ${{ secrets.TF_STATE_RESOURCE_GROUP_STAGING_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve subscription credentials
        id: sub
        run: |
          ALIAS="${{ matrix.subscription_alias }}"
          if [[ "$ALIAS" == "dev-qa" ]]; then
            echo "sub_id=$AZURE_SUB_DEV_QA"           >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_DEV_QA"     >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_DEV_QA"                   >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_DEV_QA"                   >> "$GITHUB_OUTPUT"
          else
            echo "sub_id=$AZURE_SUB_STAGING_PROD"     >> "$GITHUB_OUTPUT"
            echo "client_id=$AZURE_CLIENT_STAGING_PROD" >> "$GITHUB_OUTPUT"
            echo "sa=$TF_SA_STAGING_PROD"             >> "$GITHUB_OUTPUT"
            echo "rg=$TF_RG_STAGING_PROD"             >> "$GITHUB_OUTPUT"
          fi
          CONTAINER=$(jq -r ".subscriptions[\"$ALIAS\"].state_container" config/global/subscriptions.json)
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Resolve resource group from tfvars
        id: rg
        env:
          TEAM: ${{ matrix.team }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          # Pull resource_group_name out of the team's env tfvars
          ENV_FILE="config/teams/${TEAM}/envs/${ENVIRONMENT}.tfvars"
          RG=$(grep -E '^[[:space:]]*resource_group_name[[:space:]]*=' "$ENV_FILE" | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' || true)
          echo "name=$RG" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.sub.outputs.sub_id }}
          client-id: ${{ steps.sub.outputs.client_id }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: ${{ needs._config.outputs.terraform_version }}
          working_directory: terraform/databricks
          environment: ${{ matrix.environment }}

      - name: Terraform init
        working-directory: terraform/databricks
        env:
          STORAGE_ACCOUNT: ${{ steps.sub.outputs.sa }}
          RESOURCE_GROUP: ${{ steps.sub.outputs.rg }}
          CONTAINER: ${{ steps.sub.outputs.container }}
          STATE_KEY: "workspace/${{ matrix.team }}/${{ matrix.environment }}.tfstate"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform init \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="key=$STATE_KEY"

      - name: Terraform plan (for scanning)
        working-directory: terraform/databricks
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ steps.sub.outputs.client_id }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ steps.sub.outputs.sub_id }}
          TF_VAR_subscription_id: ${{ steps.sub.outputs.sub_id }}
        run: |
          terraform plan \
            -var-file=../../config/teams/${{ matrix.team }}/common.tfvars \
            -var-file=../../config/teams/${{ matrix.team }}/envs/${{ matrix.environment }}.tfvars \
            -out=compliance.tfplan \
            -input=false
          terraform show -json compliance.tfplan > compliance.tfplan.json

      - name: Install tflint
        run: |
          curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run tflint
        working-directory: terraform/databricks
        run: |
          tflint --init
          tflint --format json > tflint-report.json || true

      - name: Install checkov
        run: pip3 install --quiet checkov

      - name: Run checkov
        working-directory: terraform/databricks
        run: |
          checkov -f compliance.tfplan.json --framework terraform_plan --output json > checkov-report.json || true

      - name: Azure Policy compliance
        if: steps.rg.outputs.name != ''
        env:
          RG: ${{ steps.rg.outputs.name }}
        run: |
          echo "Querying Azure Policy state for RG: $RG"
          az policy state list \
            --resource-group "$RG" \
            --query '[].{policyDefinitionName: policyDefinitionName, complianceState: complianceState, resourceId: resourceId}' \
            > policy-compliance.json || true

      - name: Generate summary
        working-directory: terraform/databricks
        run: |
          SUMMARY="compliance-summary-${{ matrix.team }}-${{ matrix.environment }}.md"
          {
            echo "# Compliance Report — ${{ matrix.team }} / ${{ matrix.environment }}"
            echo ""
            echo "- Repo: ${{ github.repository }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Scan date: $(date -u)"
            echo ""
            echo "## tflint"
            echo '```json'
            cat tflint-report.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## checkov"
            echo '```json'
            cat checkov-report.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## Azure Policy"
            echo '```json'
            cat ../../policy-compliance.json 2>/dev/null || echo '[]'
            echo '```'
          } > "$SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-${{ matrix.team }}-${{ matrix.environment }}
          path: |
            terraform/databricks/tflint-report.json
            terraform/databricks/checkov-report.json
            terraform/databricks/compliance-summary-${{ matrix.team }}-${{ matrix.environment }}.md
            policy-compliance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `terraform/databricks/compliance-summary-${{ matrix.team }}-${{ matrix.environment }}.md`;
            try {
              const body = fs.readFileSync(path, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } catch (e) {
              core.warning(`Could not read ${path}: ${e.message}`);
            }
