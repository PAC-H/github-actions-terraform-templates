name: example-team-4env
display_name: "Example Team (4 Environments)"
contact: "example-team@company.com"

environments: [dev, qa, staging, prod]

databricks:
  sku: premium
  tags:
    team: example-team-4env
    cost_center: "11111"

azure:
  per_env:
    dev:
      resource_group_name: "rg-example-team-4env-dev-databricks"
      public_subnet_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-network-dev/providers/Microsoft.Network/virtualNetworks/vnet-dev/subnets/snet-databricks-public-dev"
      private_subnet_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-network-dev/providers/Microsoft.Network/virtualNetworks/vnet-dev/subnets/snet-databricks-private-dev"
      compliance_profile: standard

    qa:
      resource_group_name: "rg-example-team-4env-qa-databricks"
      public_subnet_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-network-qa/providers/Microsoft.Network/virtualNetworks/vnet-qa/subnets/snet-databricks-public-qa"
      private_subnet_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-network-qa/providers/Microsoft.Network/virtualNetworks/vnet-qa/subnets/snet-databricks-private-qa"
      compliance_profile: standard

    staging:
      resource_group_name: "rg-example-team-4env-staging-databricks"
      public_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-staging/providers/Microsoft.Network/virtualNetworks/vnet-staging/subnets/snet-databricks-public-staging"
      private_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-staging/providers/Microsoft.Network/virtualNetworks/vnet-staging/subnets/snet-databricks-private-staging"
      compliance_profile: enhanced

    prod:
      resource_group_name: "rg-example-team-4env-prod-databricks"
      public_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-prod/providers/Microsoft.Network/virtualNetworks/vnet-prod/subnets/snet-databricks-public-prod"
      private_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-prod/providers/Microsoft.Network/virtualNetworks/vnet-prod/subnets/snet-databricks-private-prod"
      compliance_profile: enhanced
