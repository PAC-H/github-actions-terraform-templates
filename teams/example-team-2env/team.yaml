name: example-team-2env
display_name: "Example Team (2 Environments)"
contact: "example-team-2@company.com"

# This team only has staging and prod — no dev or qa environments.
environments: [staging, prod]

databricks:
  sku: premium
  tags:
    team: example-team-2env
    cost_center: "22222"

azure:
  per_env:
    staging:
      resource_group_name: "rg-example-team-2env-staging-databricks"
      public_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-staging/providers/Microsoft.Network/virtualNetworks/vnet-staging/subnets/snet-databricks-public-staging-2env"
      private_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-staging/providers/Microsoft.Network/virtualNetworks/vnet-staging/subnets/snet-databricks-private-staging-2env"
      compliance_profile: enhanced

    prod:
      resource_group_name: "rg-example-team-2env-prod-databricks"
      public_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-prod/providers/Microsoft.Network/virtualNetworks/vnet-prod/subnets/snet-databricks-public-prod-2env"
      private_subnet_id: "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/rg-network-prod/providers/Microsoft.Network/virtualNetworks/vnet-prod/subnets/snet-databricks-private-prod-2env"
      compliance_profile: enhanced
