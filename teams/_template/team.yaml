# =============================================================================
# Team Configuration — the ONLY file a team needs to create.
# Copy this file to teams/<your-team-name>/team.yaml and fill in all values.
# Run: ./scripts/new-team.sh <team-name> [2|4]  to scaffold from this template.
# =============================================================================

# Team slug — must be lowercase alphanumeric with hyphens, no spaces.
# Used in resource names, workspace names, and state file keys.
name: team-name

display_name: "Human Team Name"
contact: "team@company.com"

# Which environments this team has.
# Use [dev, qa, staging, prod] for a full 4-environment team.
# Use [staging, prod] for a 2-environment team (no dev/qa).
environments: [dev, qa, staging, prod]

databricks:
  # 'premium' is required if any environment uses compliance_profile: enhanced.
  # 'standard' is sufficient for teams with compliance_profile: standard on all envs.
  sku: premium

  # Tags applied to all Databricks workspace resources for this team.
  tags:
    team: team-name
    cost_center: "00000"

azure:
  # Define one block per environment listed in `environments` above.
  # Subnets must be pre-provisioned — this module performs VNet injection into
  # existing subnets; it does NOT create VNets or subnets.
  #
  # IMPORTANT: compliance_profile is a one-way change. Once a workspace is
  # created with 'enhanced', it cannot be downgraded without destroying and
  # recreating the workspace.
  per_env:
    dev:
      # Name of the Azure resource group where the Databricks workspace is created.
      resource_group_name: "rg-team-name-dev-databricks"

      # Full Azure resource ID of the pre-existing public subnet.
      public_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{public-subnet-name}"

      # Full Azure resource ID of the pre-existing private subnet.
      private_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{private-subnet-name}"

      # 'standard' = no enhanced compliance.
      # 'enhanced' = Databricks Enhanced Security and Compliance add-on (requires premium SKU).
      compliance_profile: standard

    qa:
      resource_group_name: "rg-team-name-qa-databricks"
      public_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{public-subnet-name}"
      private_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{private-subnet-name}"
      compliance_profile: standard

    staging:
      resource_group_name: "rg-team-name-staging-databricks"
      public_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{public-subnet-name}"
      private_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{private-subnet-name}"
      compliance_profile: enhanced

    prod:
      resource_group_name: "rg-team-name-prod-databricks"
      public_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{public-subnet-name}"
      private_subnet_id: "/subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/subnets/{private-subnet-name}"
      compliance_profile: enhanced
